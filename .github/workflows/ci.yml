name: ci
on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  TEST_DATABASE_URL: postgres://execute:execute@localhost:5432/execute

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: execute
          POSTGRES_PASSWORD: execute
          POSTGRES_DB: execute
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U execute" --health-interval 2s --health-timeout 3s --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      # Unit tests plus the HTTP end-to-end suite against Postgres with stubbed upstreams.
      - run: cargo test
