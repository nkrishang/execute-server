# Local Postgres for development and tests.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: execute
      POSTGRES_PASSWORD: execute
      POSTGRES_DB: execute_server
    ports:
      - "54350:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U execute"]
      interval: 2s
      timeout: 3s
      retries: 30
